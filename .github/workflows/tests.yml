name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches Dockerfile.backend (python:3.11-slim)
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: Agents_backend
        env:
          # conftest.py sets dummy keys too; these keep any stray lookup offline.
          OPENAI_API_KEY: sk-test-dummy-key-for-ci
          TAVILY_API_KEY: tvly-test-dummy-key-for-ci
          # Keep Chroma off the network — the local-fallback path is what we test.
          CHROMA_API_KEY: ""
        run: pytest tests -q
        # Golden tests self-skip unless RUN_GOLDEN_TESTS=1 — they cost real tokens.

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --include=optional

      - name: Typecheck
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

