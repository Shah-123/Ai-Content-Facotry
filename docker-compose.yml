services:
  db:
    image: postgres:16-alpine
    container_name: ai_content_factory_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_content_factory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_content_factory"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai_content_factory_backend
    ports:
      - "8000:8000"
    volumes:
      # Mount the backend folder for persistent assets and hot-reloading code changes
      - ./Agents_backend:/app/Agents_backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ai_content_factory
    # Run uvicorn with hot-reload enabled, excluding data/blogs/uploads directories to prevent restart loops
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload --reload-exclude "data/*" --reload-exclude "blogs/*" --reload-exclude "uploads/*"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_content_factory_frontend
    ports:
      - "3000:3000"
    volumes:
      # Mount frontend code for development hot-reloading
      - ./frontend:/app
      # Avoid overwriting container node_modules with host node_modules
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_BASE_URL=ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
