version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai_content_factory_backend
    ports:
      - "8000:8000"
    volumes:
      # Mount the entire backend folder for persistent SQLite storage and hot-reloading code changes
      - ./Agents_backend:/app/Agents_backend
    env_file:
      - .env
    # Run uvicorn with hot-reload enabled, excluding data/blogs/uploads directories to prevent restart loops
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload --reload-exclude "data/*" --reload-exclude "blogs/*" --reload-exclude "uploads/*"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_content_factory_frontend
    ports:
      - "3000:3000"
    volumes:
      # Mount frontend code for development hot-reloading
      - ./frontend:/app
      # Avoid overwriting container node_modules with host node_modules
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_BASE_URL=ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
